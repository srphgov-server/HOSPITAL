services:
  healthcare-app:
    container_name: dynamics-healthcare-app
    build:
      context: .
      dockerfile: Dockerfile
    image: dynamics-healthcare:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
